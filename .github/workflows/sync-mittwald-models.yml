name: Synchronize mittwald models

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  sync-models:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'mittwald/symfony-ai-platform' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_USER_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, json, dom, xml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Configure git identity
        run: |
          git config user.name "mittwald-machine[bot]"
          git config user.email "opensource@mittwald.de"

      - name: Create working branch
        run: git checkout -B "sync-mittwald-models-$(date +%Y-%m-%d)"

      - name: Run model synchronization
        env:
          MITTWALD_AI_API_KEY: ${{ secrets.MITTWALD_AI_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_USER_TOKEN }}
        run: |
          PROMPT=$(cat <<PROMPT_EOF
          Run the synchronize-mittwald-models skill against this repository
          to audit ModelCatalog.php against what mittwald AI Hosting
          currently offers. If it finds a specific new model that should be
          routed through an existing operation type, also use the add-model
          skill to add it, following that skill's rules for routing and
          capabilities. Apply retirals, capability corrections, and
          additions directly to the working tree, and follow each skill's
          own verification steps (scripts/verify_catalog.php, vendor/bin/phpstan
          analyse).

          The MITTWALD_AI_API_KEY environment variable is already set (it
          also backs your own mittwald AI Hosting model via opencode.json).
          After making any catalog changes, also run "composer run
          test:integration" to confirm the changed or added models actually
          work against the live API, and note the result in your PR.

          This is a non-interactive, unattended run: never stop to ask a
          clarifying question. If something is ambiguous or you are not
          confident enough to act on (e.g. whether a model absent from one
          fetch of the table is retired vs. temporarily unlisted, or a new
          operation type that would need a new ModelClient/ResultConverter
          pair this bridge doesn't implement yet), leave it unchanged and
          flag it clearly in the PR instead of guessing.

          You are already on a dedicated branch
          (sync-mittwald-models-<date>), checked out from an up-to-date
          main, created for exactly this run. If, and only if, the audit
          finds drift that you fix: commit the changes (git commit, with a
          message describing what changed), push the branch with "git push
          -u origin HEAD --force" (force is safe — this branch is owned
          solely by this workflow), and open a pull request against main
          with the "gh" CLI (already authenticated via GH_TOKEN), choosing
          a PR title and body that accurately summarize what changed and
          why, and note any drift found but deliberately left unfixed plus
          the verification/integration-test results in the PR body. Never
          push to or open a PR targeting anything other than main as the
          base.

          If the audit finds the catalog is already fully in sync with no
          drift to fix, do not commit, push, or open a PR — just say so.
          PROMPT_EOF
          )
          opencode run --auto "$PROMPT"
